server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/whobetter

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - RewritePath=/api/users/?(?<remaining>.*), /users/$\{remaining}

            - id: match-service
              uri: lb://MATCH-SERVICE
              predicates:
                - Path=/api/matches/**
              filters:
                - RewritePath=/api/matches/?(?<remaining>.*), /matches/$\{remaining}

            - id: prediction-service
              uri: lb://PREDICTION-SERVICE
              predicates:
                - Path=/api/predictions/**
              filters:
                - RewritePath=/api/predictions/?(?<remaining>.*), /predictions/$\{remaining}

            - id: ranking-service
              uri: lb://RANKING-SERVICE
              predicates:
                - Path=/api/rankings/**
              filters:
                - RewritePath=/api/rankings/?(?<remaining>.*), /rankings/$\{remaining}

            - id: scoring-service
              uri: lb://SCORING-SERVICE
              predicates:
                - Path=/api/scores/**
              filters:
                - RewritePath=/api/scores/?(?<remaining>.*), /scores/$\{remaining}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: api-gateway
        url: /v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs
      - name: match-service
        url: /match-service/v3/api-docs
      - name: prediction-service
        url: /prediction-service/v3/api-docs
      - name: ranking-service
        url: /ranking-service/v3/api-docs
      - name: scoring-service
        url: /scoring-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: INFO