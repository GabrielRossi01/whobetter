server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**,/api/groups/**

            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/matches/**

            - id: prediction-service
              uri: lb://prediction-service
              predicates:
                - Path=/api/predictions/**

            - id: ranking-service
              uri: lb://ranking-service
              predicates:
                - Path=/api/rankings/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: INFO